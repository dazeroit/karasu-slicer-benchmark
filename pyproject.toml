[project]
name = "karasu-slicer-benchmark"
version = "0.1.0.dev0"
description = "Independent performance and geometric-accuracy benchmark suite for karasu-slicer and other resin slicers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ivan Maruca" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
kbench = "kbench.cli:main"

[dependency-groups]
# Development only; reviewed in docs/DECISIONS.md (BD-004).
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kbench"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT", "RUF"]
# Mathematical signs used deliberately in prose.
allowed-confusables = ["−", "×", "–"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = ["integration: needs the real karasu-cli and UVTools (KBENCH_INTEGRATION=1)"]
