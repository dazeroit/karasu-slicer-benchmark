# karasu-slicer and DragonFruit writing the same format (.goo) for the same Elegoo panels:
# a 4K panel and the 16K panel with non-square pixels.
id = "compare-elegoo"
description = "karasu-slicer and DragonFruit, both writing .goo, on the Elegoo Mars 5 and Saturn 4 Ultra 16K."

[timing]
warmup = 1
repetitions = 5
timeout_s = 1800

[[cases]]
model = "accuracy-plate"
target = "elegoo-mars-5"
slicers = ["karasu", "dragonfruit"]

[[cases]]
model = "feature-plate"
target = "elegoo-mars-5"
slicers = ["karasu", "dragonfruit"]

[[cases]]
