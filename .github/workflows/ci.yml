name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
      - name: Install the locked environment
        run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
